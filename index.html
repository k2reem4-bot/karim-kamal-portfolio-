<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Karim Kamal — Shopify Specialist Portfolio">
  <title>Karim Kamal | Shopify Specialist 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05070a; --panel:#0b0f17; --text:#f4f7fb; --muted:#8e9cb0;
      --line:rgba(255,255,255,.08); --accent:#ff3b30; --accent-glow:rgba(255, 59, 48, 0.4);
      --max:1180px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"DM Sans",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
      perspective:1200px;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    .wrap{width:min(var(--max),calc(100% - 40px));margin:auto}

    /* Navbar */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(5,7,10,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .nav-inner{height:76px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-family:"Space Grotesk";font-weight:700;font-size:22px;letter-spacing:-.04em}
    .logo span{color:var(--accent)}
    .links{display:flex;gap:30px;color:#c2cad6;font-size:14px}
    .links a:hover{color:var(--accent)}
    .menu-btn{display:none;background:none;border:0;color:white;font-size:25px;cursor:pointer}
    
    /* Hero Section */
    .hero{min-height:90vh;display:grid;align-items:center;padding:140px 0 80px;position:relative}
    .hero:before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow),transparent 65%);right:-150px;top:50px;pointer-events:none;filter:blur(40px)}
    .eyebrow{display:inline-flex;gap:9px;align-items:center;border:1px solid var(--line);padding:8px 14px;border-radius:99px;color:#cbd4df;font-size:13px;margin-bottom:25px;background:rgba(255,255,255,0.02)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
    h1{font-family:"Space Grotesk";font-size:clamp(48px,7.5vw,88px);line-height:.96;letter-spacing:-.05em;max-width:900px}
    h1 .red{color:var(--accent)}
    .hero p{color:var(--muted);max-width:650px;font-size:19px;margin:25px 0 35px}
    .actions{display:flex;gap:13px;flex-wrap:wrap}
    .btn{padding:13px 24px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px;transition:.3s;display:inline-flex;align-items:center;gap:6px}
    .btn.primary{background:var(--accent);color:#ffffff;border-color:var(--accent);box-shadow:0 10px 25px var(--accent-glow)}
    .btn.primary:hover{background:#ff5247;transform:translateY(-3px) scale(1.02)}
    .btn:hover{transform:translateY(-2px)}

    section{padding:100px 0}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:45px}
    .kicker{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.15em;font-weight:700;margin-bottom:10px}
    h2{font-family:"Space Grotesk";font-size:clamp(36px,5vw,56px);line-height:1;letter-spacing:-.05em}
    .section-head p{color:var(--muted);max-width:430px}

    .card{
      background:linear-gradient(145deg,#0d12
